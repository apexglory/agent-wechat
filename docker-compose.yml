# Base compose for the agent-wechat2 container.
#
# Production images are NOT pulled from a registry (GHCR is unreachable from the
# CN hosts). They are built once and shipped with `scripts/ship-image.sh`
# (docker save | ssh docker load), then run from the locally-loaded image.
#
# Per-host bits (image version, volume names, port, token path, proxy) live in a
# gitignored `.env` next to this file — copy `.env.example` and fill it in.
# Compose auto-loads `.env`. Optionally a `docker-compose.override.yml` can add
# structural bits (network_mode, extra env) that don't fit scalar vars.
#
# Env vars set here are environment-agnostic and required by every deployment:
#   - TZ: WeChat UI defaults to UTC without it
#   - LANG / LC_ALL: WeChat 4.x writes empty X11 WM_NAME for non-ASCII chat
#     titles under POSIX locale (xdotool search returns 0 hits, sendFast fails)

services:
  agent-wechat:
    # Pinned, locally-loaded tag (e.g. agent-wechat2:0.12.0). Set in .env.
    image: ${AGENT_WECHAT_IMAGE:?set AGENT_WECHAT_IMAGE in .env (e.g. agent-wechat2:0.12.0)}
    # Image arrives via `docker load`, never from a registry — don't try to pull.
    pull_policy: never
    container_name: ${AGENT_WECHAT_CONTAINER:-agent-wechat2}
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    ports:
      - "${AGENT_WECHAT_PORT:-6174}:6174"
    volumes:
      - data:/data
      - wechat-home:/home/wechat
      - ${AGENT_WECHAT_TOKEN:-/root/.config/agent-wechat2/token}:/data/auth-token:ro
    environment:
      - DISPLAY=:99
      - AGENT_DB_PATH=/data/agent.db
      - AGENT_PORT=6174
      - TZ=${TZ:-Asia/Shanghai}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    restart: unless-stopped

# Both volumes are EXTERNAL and their real names MUST be supplied via .env. This
# is deliberate: a fresh `compose up` then FAILS LOUDLY rather than silently
# creating empty volumes and wiping a logged-in WeChat session. To migrate an
# existing host onto the image flow with ZERO data copy, point these at the
# volumes the old `agent-wechat` container already uses (see .env.example).
volumes:
  data:
    external: true
    name: ${AGENT_WECHAT_DATA_VOLUME:?set AGENT_WECHAT_DATA_VOLUME in .env (existing data volume to reuse)}
  wechat-home:
    external: true
    name: ${AGENT_WECHAT_HOME_VOLUME:?set AGENT_WECHAT_HOME_VOLUME in .env (existing wechat-home volume to reuse)}
