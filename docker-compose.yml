# Base compose for the agent-wechat container.
#
# Per-host bits (network_mode, volume names, proxy env, ...) live in a
# local docker-compose.override.yml that is gitignored. Compose merges
# both files automatically when you run `docker compose up` from this
# directory. See dev-notes/compose-override-examples.md for samples.
#
# Env vars set here are environment-agnostic and required by every
# deployment:
#   - TZ: WeChat UI defaults to UTC without it
#   - LANG / LC_ALL: WeChat 4.x writes empty X11 WM_NAME for non-ASCII
#     chat titles under POSIX locale (xdotool search returns 0 hits,
#     sendFast fails, fallback sendMessage surfaces 'No action selected')

services:
  agent-wechat:
    image: ghcr.io/thisnick/agent-wechat:0.11.15
    container_name: agent-wechat
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    ports:
      - "6174:6174"
    volumes:
      - agent-wechat-data:/data
      - agent-wechat-home:/home/wechat
      - /root/.config/agent-wechat/token:/data/auth-token:ro
    environment:
      - DISPLAY=:99
      - AGENT_DB_PATH=/data/agent.db
      - AGENT_PORT=6174
      - TZ=${TZ:-Asia/Shanghai}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    restart: unless-stopped

volumes:
  # Both volumes are external — override must supply the actual volume name
  # via `name:` to match what the legacy container created on this host.
  agent-wechat-data:
    external: true
  agent-wechat-home:
    external: true
