# Sample docker-compose for standalone agent-wechat2 deployment.
# Generate a token before starting:
#   mkdir -p ~/.config/agent-wechat2
#   openssl rand -hex 32 > ~/.config/agent-wechat2/token
#   chmod 600 ~/.config/agent-wechat2/token

services:
  agent-wechat2:
    image: ghcr.io/apexglory/agent-wechat2:0.11.15
    container_name: agent-wechat2
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    ports:
      - "6174:6174"
    volumes:
      - agent-wechat2-data:/data
      - agent-wechat2-home:/home/wechat
      - ~/.config/agent-wechat2/token:/data/auth-token:ro
    environment:
      - PROXY=${PROXY:-}
    restart: unless-stopped

volumes:
  agent-wechat2-data:
  agent-wechat2-home:
